name: CI Quality Gates & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Automated Verification & Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r rag/requirements.txt streamlit>=1.40 plotly psutil flake8

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Full Offline Verification Suite
      run: |
        python scripts/setup_all.py --offline --skip-install

    - name: Verify Domain & Services Unit Tests
      run: |
        python tests/test_domain_physics.py
        python tests/test_services.py
        python tests/test_nfr.py

